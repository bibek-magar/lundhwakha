name: Generate covers & manifest

on:
  push:
    branches: [main]
    paths: ['pdfs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler & qpdf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf

      - name: Generate covers and issues.json
        run: python3 generate.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers issues.json
          git diff --cached --quiet || { git commit -m "Auto-generate covers & issues.json"; git push; }
